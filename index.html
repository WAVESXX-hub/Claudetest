<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CYBER CHRONO // QUIET</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300&family=Orbitron:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --tron-cyan: #7df9ff;
    --tron-cyan-2: #00d8ff;
    --tron-blue: #1ea7ff;
    --tron-orange: #ff9f1c;
    --tron-amber: #ffb347;
    --tron-deep: #002b3a;
    --bg-0: #000000;
    --bg-1: #02070d;
    --bg-2: #050d18;
    --scan: rgba(125, 249, 255, 0.035);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: "Inter", "Helvetica Neue", system-ui, sans-serif;
    color: var(--tron-cyan);
    background:
      radial-gradient(ellipse at 50% 60%, rgba(30, 167, 255, 0.18), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(125, 249, 255, 0.18), transparent 65%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 70%, var(--bg-2) 100%);
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  /* TRON grid floor */
  body::before {
    content: "";
    position: fixed;
    left: -10%;
    right: -10%;
    bottom: 0;
    height: 55%;
    background-image:
      linear-gradient(var(--tron-cyan) 1px, transparent 1px),
      linear-gradient(90deg, var(--tron-cyan) 1px, transparent 1px);
    background-size: 80px 80px, 80px 80px;
    background-position: 0 0;
    opacity: 0.22;
    transform: perspective(600px) rotateX(62deg);
    transform-origin: 50% 100%;
    mask-image: linear-gradient(to top, rgba(0,0,0,0.95), transparent 85%);
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.95), transparent 85%);
    pointer-events: none;
    z-index: 0;
    animation: gridScroll 6s linear infinite;
  }

  @keyframes gridScroll {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 0 80px, 0 0; }
  }

  /* horizon line glow */
  .horizon {
    position: fixed;
    left: 0;
    right: 0;
    top: 78%;
    height: 1px;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(125, 249, 255, 0.85),
      rgba(255, 159, 28, 0.6),
      rgba(125, 249, 255, 0.85),
      transparent
    );
    box-shadow:
      0 0 14px rgba(125, 249, 255, 0.7),
      0 0 32px rgba(125, 249, 255, 0.45);
    z-index: 1;
    pointer-events: none;
  }

  /* CRT scanlines */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 3px,
      var(--scan) 3px,
      var(--scan) 4px
    );
    mix-blend-mode: overlay;
    pointer-events: none;
    z-index: 30;
  }

  /* ===== EDGE DIGITAL PANEL ===== */
  .panel {
    position: fixed;
    left: 50%;
    top: 86%;
    transform: translate(-50%, -50%);
    z-index: 4;
    pointer-events: none;
    user-select: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .panel-time {
    position: relative;
    display: flex;
    align-items: stretch;
    gap: 6px;
    padding: 14px 22px;
    border: 1px solid rgba(125, 249, 255, 0.85);
    background:
      linear-gradient(180deg, rgba(125, 249, 255, 0.06), rgba(0, 216, 255, 0.02));
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.6),
      0 0 18px rgba(125, 249, 255, 0.45),
      inset 0 0 14px rgba(125, 249, 255, 0.18);
    clip-path: polygon(
      14px 0,
      calc(100% - 14px) 0,
      100% 14px,
      100% calc(100% - 14px),
      calc(100% - 14px) 100%,
      14px 100%,
      0 calc(100% - 14px),
      0 14px
    );
  }

  .panel-time .seg {
    font-family: "Orbitron", "Inter", system-ui, sans-serif;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    font-size: clamp(36px, 6vw, 72px);
    line-height: 1;
    letter-spacing: 0.04em;
    color: var(--tron-cyan);
    text-shadow:
      0 0 6px rgba(125, 249, 255, 0.85),
      0 0 14px rgba(30, 167, 255, 0.55);
    padding: 0 10px;
  }

  .panel-time .sep {
    align-self: center;
    width: 1px;
    height: 60%;
    background: linear-gradient(
      180deg,
      transparent,
      rgba(255, 159, 28, 0.85),
      transparent
    );
    box-shadow: 0 0 6px rgba(255, 159, 28, 0.6);
  }

  /* corner brackets */
  .panel-time::before,
  .panel-time::after {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    border: 1px solid var(--tron-orange);
    box-shadow: 0 0 6px rgba(255, 159, 28, 0.6);
  }
  .panel-time::before {
    left: -6px; top: -6px;
    border-right: none; border-bottom: none;
  }
  .panel-time::after {
    right: -6px; bottom: -6px;
    border-left: none; border-top: none;
  }

  .panel-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: "Inter", system-ui, sans-serif;
    font-weight: 300;
    font-size: clamp(10px, 1.2vmin, 12px);
    letter-spacing: 0.45em;
    color: rgba(125, 249, 255, 0.85);
    text-shadow: 0 0 6px rgba(125, 249, 255, 0.55);
    text-transform: uppercase;
  }

  .panel-meta .dot {
    width: 4px; height: 4px;
    background: var(--tron-orange);
    box-shadow: 0 0 6px var(--tron-orange);
    transform: rotate(45deg);
  }

  /* ===== ORRERY (Sun + Moon) BEHIND CLOCK ===== */
  .orrery {
    position: fixed;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    z-index: 2;
    pointer-events: none;
    width: min(92vmin, 720px);
    aspect-ratio: 1 / 1;
  }

  .orbit {
    position: absolute;
    left: 50%;
    top: 50%;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  .orbit.sun {
    width: 100%;
    height: 100%;
    border: 1px dashed rgba(255, 159, 28, 0.32);
    box-shadow:
      inset 0 0 30px rgba(255, 159, 28, 0.05),
      0 0 18px rgba(255, 159, 28, 0.06);
    animation: spin 240s linear infinite;
  }

  .orbit.moon {
    width: 64%;
    height: 64%;
    border: 1px dashed rgba(125, 249, 255, 0.3);
    box-shadow:
      inset 0 0 24px rgba(125, 249, 255, 0.05),
      0 0 14px rgba(125, 249, 255, 0.06);
    animation: spin 90s linear infinite reverse;
  }

  /* center marker (Earth) */
  .earth-mark {
    position: absolute;
    left: 50%; top: 50%;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(125, 249, 255, 0.6);
    box-shadow: 0 0 8px rgba(125, 249, 255, 0.7);
    transform: translate(-50%, -50%);
  }

  .earth-mark::before,
  .earth-mark::after {
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    width: 18px; height: 18px;
    border: 1px solid rgba(125, 249, 255, 0.35);
    transform: translate(-50%, -50%) rotate(45deg);
  }
  .earth-mark::after {
    width: 10px; height: 10px;
    border-color: rgba(255, 159, 28, 0.45);
  }

  .arm {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: 50% 50%;
    transform: translate(-50%, -50%) rotate(0deg);
    pointer-events: none;
  }

  .arm.sun-arm  { width: 100%; height: 100%; }
  .arm.moon-arm { width: 64%;  height: 64%; }

  .body {
    position: absolute;
    left: 50%;
    top: 0;
    transform: translate(-50%, -50%);
  }

  .body.sun {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff2d6 0%, var(--tron-orange) 55%, #b35c00 100%);
    box-shadow:
      0 0 14px rgba(255, 159, 28, 0.9),
      0 0 32px rgba(255, 159, 28, 0.55),
      0 0 70px rgba(255, 159, 28, 0.3);
  }

  .body.sun::after {
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 1px solid rgba(255, 159, 28, 0.4);
  }

  .body.moon {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffffff 0%, #b8e6ff 60%, #5a8fa8 100%);
    box-shadow:
      0 0 10px rgba(125, 249, 255, 0.85),
      0 0 22px rgba(125, 249, 255, 0.45);
    overflow: hidden;
  }

  /* moon phase shadow */
  .body.moon .shadow {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(0, 6, 14, 0.92);
    transform: translateX(0);
  }

  /* ===== QUIET ANALOG CLOCK ===== */
  .stage {
    position: fixed;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    z-index: 5;
    width: min(46vmin, 360px);
    aspect-ratio: 1 / 1;
    isolation: isolate;
  }

  /* soft outer halo */
  .stage::before {
    content: "";
    position: absolute;
    inset: -18%;
    background: radial-gradient(
      circle at 50% 50%,
      rgba(125, 249, 255, 0.28),
      rgba(30, 167, 255, 0.12) 45%,
      transparent 65%
    );
    filter: blur(28px);
    z-index: -1;
    animation: breathe 6s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.85; transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.04); }
  }

  .clock {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, rgba(125, 249, 255, 0.06), transparent 70%);
    border: 1px solid rgba(125, 249, 255, 0.75);
    box-shadow:
      0 0 18px rgba(125, 249, 255, 0.55),
      0 0 36px rgba(30, 167, 255, 0.35),
      inset 0 0 30px rgba(125, 249, 255, 0.22);
  }

  /* one quiet inner ring (orange accent) */
  .clock::after {
    content: "";
    position: absolute;
    inset: 8%;
    border-radius: 50%;
    border: 1px solid rgba(255, 159, 28, 0.4);
    box-shadow:
      0 0 10px rgba(255, 159, 28, 0.3),
      inset 0 0 14px rgba(255, 159, 28, 0.18);
    pointer-events: none;
  }

  .ticks {
    position: absolute;
    inset: 0;
  }

  .tick {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1px;
    height: 50%;
    transform-origin: 50% 0;
    transform: translate(-50%, 0) rotate(var(--r));
    pointer-events: none;
  }

  .tick i {
    display: block;
    width: 1px;
    height: 4px;
    background: rgba(125, 249, 255, 0.5);
    margin: 6px auto 0;
    border-radius: 1px;
  }

  .tick.major i {
    width: 2px;
    height: 10px;
    background: rgba(125, 249, 255, 0.95);
    box-shadow: 0 0 6px rgba(125, 249, 255, 0.8);
  }

  .hand {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: 50% 100%;
    border-radius: 4px;
    transition: transform 80ms cubic-bezier(0.2, 0.9, 0.3, 1.2);
    z-index: 6;
  }

  .hand.hour {
    width: 4px;
    height: 26%;
    background: linear-gradient(180deg, rgba(255,255,255,0.95), var(--tron-cyan));
    transform: translate(-50%, -100%) rotate(0deg);
    box-shadow: 0 0 8px rgba(125, 249, 255, 0.85);
  }

  .hand.minute {
    width: 3px;
    height: 38%;
    background: linear-gradient(180deg, rgba(255,255,255,0.95), var(--tron-cyan));
    transform: translate(-50%, -100%) rotate(0deg);
    box-shadow: 0 0 10px rgba(125, 249, 255, 0.85);
  }

  .hand.second {
    width: 1px;
    height: 44%;
    background: linear-gradient(180deg, var(--tron-orange), rgba(255,159,28,0.4));
    transform: translate(-50%, -100%) rotate(0deg);
    box-shadow: 0 0 8px rgba(255, 159, 28, 0.85);
  }

  /* tiny still center */
  .core {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffffff;
    transform: translate(-50%, -50%);
    box-shadow:
      0 0 6px #ffffff,
      0 0 14px var(--tron-cyan);
    z-index: 7;
  }

  /* HUD corners */
  .corner {
    position: fixed;
    font-family: "Inter", system-ui, sans-serif;
    font-weight: 300;
    font-size: 11px;
    color: rgba(125, 249, 255, 0.8);
    letter-spacing: 0.4em;
    text-shadow: 0 0 6px rgba(125, 249, 255, 0.7);
    text-transform: uppercase;
    z-index: 31;
  }
  .corner.tl { top: 16px; left: 20px; }
  .corner.tr { top: 16px; right: 20px; color: rgba(255, 159, 28, 0.8); text-shadow: 0 0 6px rgba(255, 159, 28, 0.7); }
  .corner.bl { bottom: 16px; left: 20px; color: rgba(125, 249, 255, 0.7); text-shadow: 0 0 6px rgba(125, 249, 255, 0.6); }
  .corner.br { bottom: 16px; right: 20px; color: rgba(255, 159, 28, 0.7); text-shadow: 0 0 6px rgba(255, 159, 28, 0.6); }
</style>
</head>
<body>
  <div class="corner tl">USR / FLYNN</div>
  <div class="corner tr">GRID — ENC SEC</div>
  <div class="corner bl">CYCLE 1982</div>
  <div class="corner br">END OF LINE</div>

  <div class="horizon"></div>

  <div class="orrery" aria-hidden="true">
    <div class="orbit sun"></div>
    <div class="orbit moon"></div>
    <div class="arm sun-arm" id="sunArm">
      <div class="body sun"></div>
    </div>
    <div class="arm moon-arm" id="moonArm">
      <div class="body moon"><div class="shadow" id="moonShadow"></div></div>
    </div>
    <div class="earth-mark"></div>
  </div>

  <main class="stage" aria-label="アナログ時計">
    <div class="clock">
      <div class="ticks" id="ticks"></div>
      <div class="hand hour" id="hour"></div>
      <div class="hand minute" id="minute"></div>
      <div class="hand second" id="second"></div>
      <div class="core"></div>
    </div>
  </main>

  <div class="panel" aria-hidden="true">
    <div class="panel-time">
      <span class="seg" id="hh">00</span>
      <span class="sep"></span>
      <span class="seg" id="mm">00</span>
      <span class="sep"></span>
      <span class="seg" id="ss">00</span>
    </div>
    <div class="panel-meta">
      <span id="date"></span>
      <span class="dot"></span>
      <span id="ampm"></span>
    </div>
  </div>

<script>
  (function () {
    const ticksEl = document.getElementById("ticks");

    for (let i = 0; i < 60; i++) {
      const t = document.createElement("div");
      t.className = "tick" + (i % 5 === 0 ? " major" : "");
      t.style.setProperty("--r", `${i * 6}deg`);
      t.innerHTML = "<i></i>";
      ticksEl.appendChild(t);
    }

    const hourHand = document.getElementById("hour");
    const minHand = document.getElementById("minute");
    const secHand = document.getElementById("second");
    const hh = document.getElementById("hh");
    const mm = document.getElementById("mm");
    const ss = document.getElementById("ss");
    const dateEl = document.getElementById("date");
    const ampmEl = document.getElementById("ampm");
    const sunArm = document.getElementById("sunArm");
    const moonArm = document.getElementById("moonArm");
    const moonShadow = document.getElementById("moonShadow");

    const J2000 = Date.UTC(2000, 0, 1, 12, 0, 0);
    function celestial(now) {
      const days = (now.getTime() - J2000) / 86400000;
      const sunLon  = ((280.46 + 0.9856474 * days) % 360 + 360) % 360;
      const moonLon = ((218.316 + 13.176396 * days) % 360 + 360) % 360;
      const phase = ((moonLon - sunLon) % 360 + 360) % 360;
      return { sunLon, moonLon, phase };
    }

    const pad = (n) => String(n).padStart(2, "0");
    const weekday = ["日", "月", "火", "水", "木", "金", "土"];

    function tick() {
      const now = new Date();
      const ms = now.getMilliseconds();
      const s = now.getSeconds() + ms / 1000;
      const m = now.getMinutes() + s / 60;
      const h = (now.getHours() % 12) + m / 60;

      secHand.style.transform = `translate(-50%, -100%) rotate(${s * 6}deg)`;
      minHand.style.transform = `translate(-50%, -100%) rotate(${m * 6}deg)`;
      hourHand.style.transform = `translate(-50%, -100%) rotate(${h * 30}deg)`;

      hh.textContent = pad(now.getHours());
      mm.textContent = pad(now.getMinutes());
      ss.textContent = pad(now.getSeconds());

      dateEl.textContent =
        `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())} ${weekday[now.getDay()]}`;
      ampmEl.textContent = now.getHours() < 12 ? "AM" : "PM";

      const { sunLon, moonLon, phase } = celestial(now);
      sunArm.style.transform  = `translate(-50%, -50%) rotate(${sunLon}deg)`;
      moonArm.style.transform = `translate(-50%, -50%) rotate(${moonLon}deg)`;
      // moon phase: shadow slides from -100% (new) to +100% (full)
      const t = Math.cos((phase * Math.PI) / 180);
      moonShadow.style.transform = `translateX(${t * 100}%)`;

      requestAnimationFrame(tick);
    }

    tick();
  })();
</script>
</body>
</html>
