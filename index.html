<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CYBER CHRONO // WARP</title>
<style>
  :root {
    --neon-pink: #ff2bd6;
    --neon-magenta: #ff00a8;
    --neon-cyan: #00f0ff;
    --neon-blue: #2b5bff;
    --neon-lime: #b6ff1a;
    --neon-yellow: #fff200;
    --neon-violet: #9d00ff;
    --bg-0: #03010a;
    --bg-1: #08021c;
    --bg-2: #15022e;
    --scan: rgba(0, 240, 255, 0.045);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: "Share Tech Mono", "SF Mono", "Menlo", "Consolas", monospace;
    color: var(--neon-cyan);
    background:
      radial-gradient(ellipse at 50% 35%, rgba(0, 240, 255, 0.18), transparent 55%),
      radial-gradient(ellipse at 20% 90%, rgba(255, 0, 168, 0.32), transparent 55%),
      radial-gradient(ellipse at 80% 95%, rgba(157, 0, 255, 0.4), transparent 60%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1) 50%, var(--bg-2));
    display: grid;
    place-items: center;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  /* far-distance horizon haze */
  body::before {
    content: "";
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 55%;
    background:
      linear-gradient(to top, rgba(255, 0, 168, 0.15), transparent 70%),
      repeating-linear-gradient(
        to top,
        transparent 0,
        transparent 6px,
        rgba(0, 240, 255, 0.04) 6px,
        rgba(0, 240, 255, 0.04) 7px
      );
    mask-image: linear-gradient(to top, black, transparent);
    -webkit-mask-image: linear-gradient(to top, black, transparent);
    pointer-events: none;
    z-index: 0;
  }

  /* CRT scanlines */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 3px,
      var(--scan) 3px,
      var(--scan) 4px
    );
    mix-blend-mode: overlay;
    pointer-events: none;
    z-index: 30;
  }

  /* ===== MIRAGE DIGITAL CLOCK (background, huge) ===== */
  .mirage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    z-index: 1;
    pointer-events: none;
    user-select: none;
  }

  .mirage-stack {
    position: relative;
    width: 100%;
    text-align: center;
    transform: translateY(-2%);
  }

  .mirage-time {
    font-family: "Share Tech Mono", "SF Mono", monospace;
    font-weight: 700;
    font-size: clamp(120px, 32vw, 480px);
    line-height: 0.85;
    letter-spacing: -0.02em;
    color: rgba(255, 255, 255, 0.0);
    background:
      linear-gradient(
        180deg,
        rgba(0, 240, 255, 0.0) 0%,
        rgba(0, 240, 255, 0.55) 18%,
        rgba(255, 43, 214, 0.7) 50%,
        rgba(157, 0, 255, 0.55) 78%,
        rgba(255, 0, 168, 0.0) 100%
      );
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: url(#heatHaze) blur(0.5px);
    text-shadow: 0 0 60px rgba(0, 240, 255, 0.15);
    mix-blend-mode: screen;
    opacity: 0.85;
    animation: mirageSway 9s ease-in-out infinite;
  }

  /* second layer: deep echo behind */
  .mirage-echo {
    position: absolute;
    inset: 0;
    font-family: "Share Tech Mono", "SF Mono", monospace;
    font-weight: 700;
    font-size: clamp(120px, 32vw, 480px);
    line-height: 0.85;
    letter-spacing: -0.02em;
    color: transparent;
    -webkit-text-stroke: 1px rgba(0, 240, 255, 0.25);
    text-stroke: 1px rgba(0, 240, 255, 0.25);
    filter: blur(8px);
    transform: scale(1.04);
    animation: mirageDrift 14s ease-in-out infinite;
  }

  .mirage-meta {
    margin-top: clamp(4px, 1vh, 12px);
    font-size: clamp(11px, 1.6vmin, 14px);
    letter-spacing: 0.6em;
    color: rgba(255, 0, 168, 0.55);
    text-shadow:
      0 0 8px rgba(255, 0, 168, 0.5),
      0 0 18px rgba(157, 0, 255, 0.4);
    text-transform: uppercase;
    filter: blur(0.4px);
  }

  @keyframes mirageSway {
    0%, 100% { transform: translateY(0) skewX(0deg); }
    25%      { transform: translateY(-4px) skewX(0.3deg); }
    50%      { transform: translateY(2px) skewX(-0.3deg); }
    75%      { transform: translateY(-3px) skewX(0.2deg); }
  }

  @keyframes mirageDrift {
    0%, 100% { transform: scale(1.04) translateY(0); opacity: 0.65; }
    50%      { transform: scale(1.07) translateY(-6px); opacity: 0.9; }
  }

  /* ===== WARP PORTAL ANALOG CLOCK ===== */
  .stage {
    position: relative;
    z-index: 5;
    width: min(78vmin, 540px);
    aspect-ratio: 1 / 1;
    display: grid;
    place-items: center;
    isolation: isolate;
  }

  /* outer halo (energy bloom) */
  .stage::before {
    content: "";
    position: absolute;
    inset: -22%;
    background:
      radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.35), transparent 55%),
      radial-gradient(circle at 50% 50%, rgba(255, 0, 168, 0.3), transparent 65%);
    filter: blur(40px);
    z-index: -2;
    animation: haloPulse 4s ease-in-out infinite;
  }

  @keyframes haloPulse {
    0%, 100% { opacity: 0.85; transform: scale(1); }
    50%      { opacity: 1; transform: scale(1.05); }
  }

  /* portal energy ring (rotating conic gradient) */
  .stage::after {
    content: "";
    position: absolute;
    inset: -4%;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      var(--neon-cyan),
      var(--neon-pink),
      var(--neon-violet),
      var(--neon-yellow),
      var(--neon-lime),
      var(--neon-cyan)
    );
    filter: blur(14px);
    opacity: 0.7;
    z-index: -1;
    animation: spin 6s linear infinite;
    mask: radial-gradient(circle, transparent 56%, black 60%, black 72%, transparent 78%);
    -webkit-mask: radial-gradient(circle, transparent 56%, black 60%, black 72%, transparent 78%);
  }

  .clock {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.06) 0%, transparent 30%),
      radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.12) 30%, transparent 60%),
      radial-gradient(circle at 50% 50%, rgba(157, 0, 255, 0.18) 60%, transparent 90%);
    border: 2px solid rgba(0, 240, 255, 0.7);
    box-shadow:
      0 0 30px rgba(0, 240, 255, 0.6),
      0 0 70px rgba(255, 0, 168, 0.5),
      inset 0 0 60px rgba(0, 240, 255, 0.35),
      inset 0 0 120px rgba(255, 0, 168, 0.25);
  }

  /* warp tunnel: nested rings receding into center */
  .tunnel {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    pointer-events: none;
  }

  .tunnel .ring {
    position: absolute;
    left: 50%;
    top: 50%;
    border-radius: 50%;
    border: 1px solid rgba(0, 240, 255, 0.5);
    transform: translate(-50%, -50%);
    animation: warpZoom 4s linear infinite;
    box-shadow:
      0 0 12px rgba(0, 240, 255, 0.6),
      inset 0 0 12px rgba(255, 0, 168, 0.5);
  }
  .tunnel .ring:nth-child(1) { animation-delay: 0s;   border-color: rgba(0, 240, 255, 0.8); }
  .tunnel .ring:nth-child(2) { animation-delay: 0.5s; border-color: rgba(255, 43, 214, 0.7); }
  .tunnel .ring:nth-child(3) { animation-delay: 1.0s; border-color: rgba(182, 255, 26, 0.7); }
  .tunnel .ring:nth-child(4) { animation-delay: 1.5s; border-color: rgba(157, 0, 255, 0.8); }
  .tunnel .ring:nth-child(5) { animation-delay: 2.0s; border-color: rgba(255, 242, 0, 0.7); }
  .tunnel .ring:nth-child(6) { animation-delay: 2.5s; border-color: rgba(0, 240, 255, 0.7); }
  .tunnel .ring:nth-child(7) { animation-delay: 3.0s; border-color: rgba(255, 0, 168, 0.7); }
  .tunnel .ring:nth-child(8) { animation-delay: 3.5s; border-color: rgba(43, 91, 255, 0.7); }

  @keyframes warpZoom {
    0%   { width: 4%;   height: 4%;   opacity: 0; }
    20%  { opacity: 1; }
    100% { width: 110%; height: 110%; opacity: 0; }
  }

  /* radial light beams from center */
  .beams {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    background:
      conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(0, 240, 255, 0.35) 4deg,
        transparent 8deg,
        transparent 30deg,
        rgba(255, 0, 168, 0.3) 34deg,
        transparent 38deg,
        transparent 60deg,
        rgba(182, 255, 26, 0.3) 64deg,
        transparent 68deg,
        transparent 90deg,
        rgba(157, 0, 255, 0.35) 94deg,
        transparent 98deg,
        transparent 120deg,
        rgba(0, 240, 255, 0.3) 124deg,
        transparent 128deg,
        transparent 150deg,
        rgba(255, 242, 0, 0.3) 154deg,
        transparent 158deg,
        transparent 180deg,
        rgba(0, 240, 255, 0.35) 184deg,
        transparent 188deg,
        transparent 210deg,
        rgba(255, 0, 168, 0.3) 214deg,
        transparent 218deg,
        transparent 240deg,
        rgba(182, 255, 26, 0.3) 244deg,
        transparent 248deg,
        transparent 270deg,
        rgba(157, 0, 255, 0.35) 274deg,
        transparent 278deg,
        transparent 300deg,
        rgba(0, 240, 255, 0.3) 304deg,
        transparent 308deg,
        transparent 330deg,
        rgba(255, 242, 0, 0.3) 334deg,
        transparent 338deg,
        transparent 360deg
      );
    mask: radial-gradient(circle, transparent 8%, black 18%, transparent 95%);
    -webkit-mask: radial-gradient(circle, transparent 8%, black 18%, transparent 95%);
    animation: spin 18s linear infinite reverse;
    mix-blend-mode: screen;
    opacity: 0.85;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .ticks {
    position: absolute;
    inset: 0;
  }

  .tick {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 2px;
    height: 48%;
    transform-origin: 50% 0;
    transform: translate(-50%, 0) rotate(var(--r));
  }

  .tick i {
    display: block;
    width: 2px;
    height: 8px;
    background: var(--neon-cyan);
    margin: 8px auto 0;
    border-radius: 2px;
    box-shadow: 0 0 6px var(--neon-cyan), 0 0 12px var(--neon-cyan);
  }

  .tick.major i {
    width: 4px;
    height: 20px;
    background: var(--neon-pink);
    box-shadow:
      0 0 10px var(--neon-pink),
      0 0 20px var(--neon-magenta),
      0 0 30px var(--neon-magenta);
  }

  .numbers {
    position: absolute;
    inset: 0;
  }

  .number {
    position: absolute;
    left: 50%;
    top: 50%;
    font-family: "Share Tech Mono", "SF Mono", monospace;
    font-size: clamp(12px, 2.4vmin, 20px);
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--neon-lime);
    transform: translate(-50%, -50%) translate(var(--x), var(--y));
    text-shadow:
      0 0 6px var(--neon-lime),
      0 0 14px var(--neon-lime);
  }

  .number.quarter {
    color: var(--neon-yellow);
    text-shadow:
      0 0 8px var(--neon-yellow),
      0 0 18px var(--neon-yellow);
  }

  .hand {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: 50% 100%;
    border-radius: 4px;
    transition: transform 80ms cubic-bezier(0.2, 0.9, 0.3, 1.2);
    z-index: 6;
  }

  .hand.hour {
    width: 8px;
    height: 26%;
    background: linear-gradient(180deg, #ffffff, var(--neon-cyan));
    transform: translate(-50%, -100%) rotate(0deg);
    box-shadow:
      0 0 10px var(--neon-cyan),
      0 0 20px var(--neon-cyan),
      0 0 30px var(--neon-blue);
  }

  .hand.minute {
    width: 5px;
    height: 36%;
    background: linear-gradient(180deg, #ffffff, var(--neon-pink));
    transform: translate(-50%, -100%) rotate(0deg);
    box-shadow:
      0 0 10px var(--neon-pink),
      0 0 22px var(--neon-magenta),
      0 0 34px var(--neon-magenta);
  }

  .hand.second {
    width: 2px;
    height: 44%;
    background: linear-gradient(180deg, var(--neon-yellow), var(--neon-lime));
    transform: translate(-50%, -100%) rotate(0deg);
    box-shadow:
      0 0 8px var(--neon-yellow),
      0 0 18px var(--neon-lime),
      0 0 28px var(--neon-lime);
  }

  /* singularity core at center */
  .core {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: radial-gradient(
      circle at 35% 35%,
      #ffffff 0%,
      var(--neon-cyan) 30%,
      var(--neon-pink) 60%,
      var(--neon-violet) 90%
    );
    transform: translate(-50%, -50%);
    box-shadow:
      0 0 18px #ffffff,
      0 0 36px var(--neon-cyan),
      0 0 60px var(--neon-pink),
      0 0 90px var(--neon-violet);
    z-index: 7;
    animation: corePulse 1.6s ease-in-out infinite;
  }

  @keyframes corePulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50%      { transform: translate(-50%, -50%) scale(1.18); }
  }

  /* HUD corners */
  .corner {
    position: fixed;
    font-size: 11px;
    color: var(--neon-cyan);
    letter-spacing: 0.25em;
    text-shadow: 0 0 6px var(--neon-cyan);
    z-index: 31;
    opacity: 0.85;
  }
  .corner.tl { top: 16px; left: 20px; }
  .corner.tr { top: 16px; right: 20px; color: var(--neon-pink); text-shadow: 0 0 6px var(--neon-pink); }
  .corner.bl { bottom: 16px; left: 20px; color: var(--neon-lime); text-shadow: 0 0 6px var(--neon-lime); }
  .corner.br { bottom: 16px; right: 20px; color: var(--neon-yellow); text-shadow: 0 0 6px var(--neon-yellow); }

  .hint {
    position: fixed;
    bottom: 18px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: var(--neon-violet);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    text-shadow: 0 0 6px var(--neon-violet), 0 0 14px var(--neon-violet);
    z-index: 31;
  }
</style>
</head>
<body>
  <!-- SVG filter for heat-haze mirage distortion -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <filter id="heatHaze" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.025" numOctaves="2" seed="3">
          <animate attributeName="baseFrequency" dur="18s" values="0.012 0.025;0.018 0.04;0.012 0.025" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" scale="14"/>
      </filter>
    </defs>
  </svg>

  <div class="corner tl">◤ DIM::SHIFT_03</div>
  <div class="corner tr">WARP STABLE ▮▮▮▮▯</div>
  <div class="corner bl">FIELD φ 0.998</div>
  <div class="corner br">CORE ∞</div>

  <!-- background mirage digital clock -->
  <div class="mirage" aria-hidden="true">
    <div class="mirage-stack">
      <div class="mirage-echo" id="echo">00:00:00</div>
      <div class="mirage-time" id="mirageTime">00:00:00</div>
      <div class="mirage-meta"><span id="date"></span> ▸ <span id="ampm"></span></div>
    </div>
  </div>

  <!-- foreground warp portal analog clock -->
  <main class="stage" aria-label="ワープ装置型アナログ時計">
    <div class="clock">
      <div class="beams"></div>
      <div class="tunnel">
        <div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div>
        <div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div>
      </div>
      <div class="ticks" id="ticks"></div>
      <div class="numbers" id="numbers"></div>
      <div class="hand hour" id="hour"></div>
      <div class="hand minute" id="minute"></div>
      <div class="hand second" id="second"></div>
      <div class="core"></div>
    </div>
  </main>

  <div class="hint">// MIRAGE ⨯ WARP · TEMPORAL FIELD ENGAGED</div>

<script>
  (function () {
    const ticksEl = document.getElementById("ticks");
    const numbersEl = document.getElementById("numbers");

    for (let i = 0; i < 60; i++) {
      const t = document.createElement("div");
      t.className = "tick" + (i % 5 === 0 ? " major" : "");
      t.style.setProperty("--r", `${i * 6}deg`);
      t.innerHTML = "<i></i>";
      ticksEl.appendChild(t);
    }

    const radius = 42;
    for (let n = 1; n <= 12; n++) {
      const angle = (n / 12) * Math.PI * 2 - Math.PI / 2;
      const x = Math.cos(angle) * radius;
      const y = Math.sin(angle) * radius;
      const el = document.createElement("div");
      const isQuarter = n % 3 === 0;
      el.className = "number" + (isQuarter ? " quarter" : "");
      el.style.setProperty("--x", `${x}%`);
      el.style.setProperty("--y", `${y}%`);
      el.textContent = String(n).padStart(2, "0");
      numbersEl.appendChild(el);
    }

    const hourHand = document.getElementById("hour");
    const minHand = document.getElementById("minute");
    const secHand = document.getElementById("second");
    const mirageTime = document.getElementById("mirageTime");
    const echo = document.getElementById("echo");
    const dateEl = document.getElementById("date");
    const ampmEl = document.getElementById("ampm");

    const pad = (n) => String(n).padStart(2, "0");
    const weekday = ["日", "月", "火", "水", "木", "金", "土"];

    function tick() {
      const now = new Date();
      const ms = now.getMilliseconds();
      const s = now.getSeconds() + ms / 1000;
      const m = now.getMinutes() + s / 60;
      const h = (now.getHours() % 12) + m / 60;

      secHand.style.transform = `translate(-50%, -100%) rotate(${s * 6}deg)`;
      minHand.style.transform = `translate(-50%, -100%) rotate(${m * 6}deg)`;
      hourHand.style.transform = `translate(-50%, -100%) rotate(${h * 30}deg)`;

      const text = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      mirageTime.textContent = text;
      echo.textContent = text;

      dateEl.textContent =
        `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())} ${weekday[now.getDay()]}`;
      ampmEl.textContent = now.getHours() < 12 ? "AM" : "PM";

      requestAnimationFrame(tick);
    }

    tick();
  })();
</script>
</body>
</html>
