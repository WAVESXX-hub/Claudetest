<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hybrid Clock</title>
<style>
  :root {
    --bg-1: #0b1020;
    --bg-2: #1a1f3a;
    --accent: #6ee7ff;
    --accent-2: #ff6ec7;
    --tick: rgba(255, 255, 255, 0.55);
    --tick-strong: rgba(255, 255, 255, 0.95);
    --face: rgba(255, 255, 255, 0.04);
    --face-border: rgba(255, 255, 255, 0.18);
    --digital: #e8f9ff;
    --shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: "Helvetica Neue", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    color: var(--digital);
    background:
      radial-gradient(circle at 20% 20%, rgba(110, 231, 255, 0.15), transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(255, 110, 199, 0.15), transparent 50%),
      linear-gradient(135deg, var(--bg-1), var(--bg-2));
    display: grid;
    place-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .clock {
    position: relative;
    width: min(78vmin, 520px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.06), transparent 65%),
      conic-gradient(from 0deg, rgba(110, 231, 255, 0.08), rgba(255, 110, 199, 0.08), rgba(110, 231, 255, 0.08));
    border: 1px solid var(--face-border);
    box-shadow: var(--shadow), inset 0 0 40px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(6px);
  }

  .clock::before {
    content: "";
    position: absolute;
    inset: 6%;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.05), transparent 60%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    pointer-events: none;
  }

  .ticks {
    position: absolute;
    inset: 0;
  }

  .tick {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 2px;
    height: 48%;
    transform-origin: 50% 0;
    transform: translate(-50%, 0) rotate(var(--r));
  }

  .tick i {
    display: block;
    width: 2px;
    height: 10px;
    background: var(--tick);
    margin: 6px auto 0;
    border-radius: 2px;
  }

  .tick.major i {
    width: 3px;
    height: 18px;
    background: var(--tick-strong);
    box-shadow: 0 0 8px rgba(110, 231, 255, 0.55);
  }

  .numbers {
    position: absolute;
    inset: 0;
  }

  .number {
    position: absolute;
    left: 50%;
    top: 50%;
    font-size: clamp(14px, 2.6vmin, 22px);
    font-weight: 600;
    letter-spacing: 0.05em;
    color: rgba(255, 255, 255, 0.85);
    transform: translate(-50%, -50%) translate(var(--x), var(--y));
    text-shadow: 0 0 10px rgba(110, 231, 255, 0.35);
  }

  .hand {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: 50% 100%;
    border-radius: 4px;
    transition: transform 80ms cubic-bezier(0.2, 0.9, 0.3, 1.2);
  }

  .hand.hour {
    width: 6px;
    height: 26%;
    background: linear-gradient(180deg, #ffffff, #9fb4ff);
    transform: translate(-50%, -100%) rotate(0deg);
    box-shadow: 0 0 12px rgba(159, 180, 255, 0.6);
  }

  .hand.minute {
    width: 4px;
    height: 36%;
    background: linear-gradient(180deg, var(--accent), #4a90e2);
    transform: translate(-50%, -100%) rotate(0deg);
    box-shadow: 0 0 14px rgba(110, 231, 255, 0.75);
  }

  .hand.second {
    width: 2px;
    height: 42%;
    background: linear-gradient(180deg, var(--accent-2), #ff9eb5);
    transform: translate(-50%, -100%) rotate(0deg);
    box-shadow: 0 0 16px rgba(255, 110, 199, 0.8);
  }

  .cap {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffffff, #6ee7ff 60%, #2a3a6b);
    transform: translate(-50%, -50%);
    box-shadow: 0 0 14px rgba(110, 231, 255, 0.8), inset 0 0 4px rgba(0, 0, 0, 0.4);
  }

  .digital {
    position: absolute;
    left: 50%;
    top: 62%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    user-select: none;
  }

  .digital .time {
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-size: clamp(18px, 4.8vmin, 38px);
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--digital);
    text-shadow:
      0 0 8px rgba(110, 231, 255, 0.6),
      0 0 18px rgba(110, 231, 255, 0.3);
  }

  .digital .time .sep {
    display: inline-block;
    width: 0.5ch;
    text-align: center;
    animation: blink 1s steps(2, end) infinite;
  }

  .digital .meta {
    margin-top: 6px;
    font-size: clamp(10px, 1.8vmin, 13px);
    letter-spacing: 0.2em;
    color: rgba(232, 249, 255, 0.7);
    text-transform: uppercase;
  }

  @keyframes blink {
    50% { opacity: 0.25; }
  }

  .brand {
    position: absolute;
    left: 50%;
    top: 32%;
    transform: translate(-50%, -50%);
    font-size: clamp(9px, 1.6vmin, 12px);
    letter-spacing: 0.45em;
    color: rgba(255, 255, 255, 0.45);
    text-transform: uppercase;
  }

  .hint {
    position: fixed;
    bottom: 18px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: rgba(232, 249, 255, 0.45);
    letter-spacing: 0.15em;
  }
</style>
</head>
<body>
  <main class="clock" aria-label="ハイブリッド時計">
    <div class="ticks" id="ticks"></div>
    <div class="numbers" id="numbers"></div>

    <div class="brand">HYBRID · CHRONO</div>

    <div class="digital">
      <div class="time">
        <span id="hh">00</span><span class="sep">:</span><span id="mm">00</span><span class="sep">:</span><span id="ss">00</span>
      </div>
      <div class="meta"><span id="date"></span> · <span id="ampm"></span></div>
    </div>

    <div class="hand hour" id="hour"></div>
    <div class="hand minute" id="minute"></div>
    <div class="hand second" id="second"></div>
    <div class="cap"></div>
  </main>

  <div class="hint">Analog + Digital · Live</div>

<script>
  (function () {
    const ticksEl = document.getElementById("ticks");
    const numbersEl = document.getElementById("numbers");

    for (let i = 0; i < 60; i++) {
      const t = document.createElement("div");
      t.className = "tick" + (i % 5 === 0 ? " major" : "");
      t.style.setProperty("--r", `${i * 6}deg`);
      t.innerHTML = "<i></i>";
      ticksEl.appendChild(t);
    }

    const radius = 40;
    for (let n = 1; n <= 12; n++) {
      const angle = (n / 12) * Math.PI * 2 - Math.PI / 2;
      const x = Math.cos(angle) * radius;
      const y = Math.sin(angle) * radius;
      const el = document.createElement("div");
      el.className = "number";
      el.style.setProperty("--x", `${x}%`);
      el.style.setProperty("--y", `${y}%`);
      el.textContent = String(n);
      numbersEl.appendChild(el);
    }

    const hourHand = document.getElementById("hour");
    const minHand = document.getElementById("minute");
    const secHand = document.getElementById("second");
    const hh = document.getElementById("hh");
    const mm = document.getElementById("mm");
    const ss = document.getElementById("ss");
    const dateEl = document.getElementById("date");
    const ampmEl = document.getElementById("ampm");

    const pad = (n) => String(n).padStart(2, "0");
    const weekday = ["日", "月", "火", "水", "木", "金", "土"];

    function tick() {
      const now = new Date();
      const ms = now.getMilliseconds();
      const s = now.getSeconds() + ms / 1000;
      const m = now.getMinutes() + s / 60;
      const h = (now.getHours() % 12) + m / 60;

      secHand.style.transform = `translate(-50%, -100%) rotate(${s * 6}deg)`;
      minHand.style.transform = `translate(-50%, -100%) rotate(${m * 6}deg)`;
      hourHand.style.transform = `translate(-50%, -100%) rotate(${h * 30}deg)`;

      hh.textContent = pad(now.getHours());
      mm.textContent = pad(now.getMinutes());
      ss.textContent = pad(now.getSeconds());

      dateEl.textContent =
        `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())} ${weekday[now.getDay()]}`;
      ampmEl.textContent = now.getHours() < 12 ? "AM" : "PM";

      requestAnimationFrame(tick);
    }

    tick();
  })();
</script>
</body>
</html>
