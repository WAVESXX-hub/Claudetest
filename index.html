<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CYBER CHRONO // QUIET</title>
<style>
  :root {
    --neon-pink: #ff2bd6;
    --neon-magenta: #ff00a8;
    --neon-cyan: #00f0ff;
    --neon-blue: #2b5bff;
    --neon-violet: #9d00ff;
    --bg-0: #03010a;
    --bg-1: #07021a;
    --bg-2: #100426;
    --scan: rgba(0, 240, 255, 0.04);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: "Share Tech Mono", "SF Mono", "Menlo", "Consolas", monospace;
    color: var(--neon-cyan);
    background:
      radial-gradient(ellipse at 50% 78%, rgba(255, 0, 168, 0.22), transparent 55%),
      radial-gradient(ellipse at 50% 95%, rgba(157, 0, 255, 0.35), transparent 60%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 60%, var(--bg-2) 100%);
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  /* horizon line glow */
  .horizon {
    position: fixed;
    left: 0;
    right: 0;
    top: 78%;
    height: 1px;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(0, 240, 255, 0.45),
      rgba(255, 43, 214, 0.55),
      rgba(0, 240, 255, 0.45),
      transparent
    );
    box-shadow:
      0 0 14px rgba(0, 240, 255, 0.55),
      0 0 30px rgba(255, 0, 168, 0.4);
    z-index: 1;
    pointer-events: none;
  }

  /* CRT scanlines */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 3px,
      var(--scan) 3px,
      var(--scan) 4px
    );
    mix-blend-mode: overlay;
    pointer-events: none;
    z-index: 30;
  }

  /* ===== MIRAGE DIGITAL CLOCK (far horizon) ===== */
  .mirage {
    position: fixed;
    left: 0;
    right: 0;
    top: 78%;
    transform: translateY(-100%);
    text-align: center;
    z-index: 2;
    pointer-events: none;
    user-select: none;
  }

  .mirage-stack {
    position: relative;
    display: inline-block;
    transform: perspective(800px) rotateX(18deg);
    transform-origin: 50% 100%;
  }

  .mirage-time {
    font-family: "Share Tech Mono", "SF Mono", monospace;
    font-weight: 700;
    font-size: clamp(80px, 18vw, 260px);
    line-height: 0.85;
    letter-spacing: 0.02em;
    color: transparent;
    background:
      linear-gradient(
        180deg,
        rgba(0, 240, 255, 0.0) 0%,
        rgba(0, 240, 255, 0.4) 25%,
        rgba(255, 43, 214, 0.55) 65%,
        rgba(157, 0, 255, 0.0) 100%
      );
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: url(#heatHaze) blur(0.6px);
    mix-blend-mode: screen;
    opacity: 0.7;
    animation: mirageSway 11s ease-in-out infinite;
  }

  .mirage-echo {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    font-family: "Share Tech Mono", "SF Mono", monospace;
    font-weight: 700;
    font-size: clamp(80px, 18vw, 260px);
    line-height: 0.85;
    letter-spacing: 0.02em;
    color: transparent;
    -webkit-text-stroke: 1px rgba(0, 240, 255, 0.18);
    filter: blur(10px);
    transform: scale(1.04);
    opacity: 0.55;
    animation: mirageDrift 16s ease-in-out infinite;
  }

  .mirage-meta {
    margin-top: 6px;
    font-size: clamp(10px, 1.3vmin, 12px);
    letter-spacing: 0.7em;
    color: rgba(255, 0, 168, 0.4);
    text-shadow: 0 0 10px rgba(255, 0, 168, 0.4);
    text-transform: uppercase;
    filter: blur(0.4px);
  }

  @keyframes mirageSway {
    0%, 100% { transform: translateY(0) skewX(0deg); }
    50%      { transform: translateY(-2px) skewX(0.2deg); }
  }

  @keyframes mirageDrift {
    0%, 100% { transform: scale(1.04) translateY(0); opacity: 0.45; }
    50%      { transform: scale(1.06) translateY(-3px); opacity: 0.7; }
  }

  /* ===== QUIET ANALOG CLOCK ===== */
  .stage {
    position: fixed;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    z-index: 5;
    width: min(46vmin, 360px);
    aspect-ratio: 1 / 1;
    isolation: isolate;
  }

  /* soft outer halo */
  .stage::before {
    content: "";
    position: absolute;
    inset: -18%;
    background: radial-gradient(
      circle at 50% 50%,
      rgba(0, 240, 255, 0.22),
      rgba(255, 0, 168, 0.08) 45%,
      transparent 65%
    );
    filter: blur(28px);
    z-index: -1;
    animation: breathe 6s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.85; transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.04); }
  }

  .clock {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.06), transparent 70%);
    border: 1px solid rgba(0, 240, 255, 0.55);
    box-shadow:
      0 0 18px rgba(0, 240, 255, 0.45),
      inset 0 0 30px rgba(0, 240, 255, 0.18);
  }

  /* one quiet inner ring */
  .clock::after {
    content: "";
    position: absolute;
    inset: 8%;
    border-radius: 50%;
    border: 1px solid rgba(255, 43, 214, 0.35);
    box-shadow:
      0 0 10px rgba(255, 43, 214, 0.25),
      inset 0 0 14px rgba(255, 43, 214, 0.18);
    pointer-events: none;
  }

  .ticks {
    position: absolute;
    inset: 0;
  }

  .tick {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1px;
    height: 50%;
    transform-origin: 50% 0;
    transform: translate(-50%, 0) rotate(var(--r));
    pointer-events: none;
  }

  .tick i {
    display: block;
    width: 1px;
    height: 4px;
    background: rgba(0, 240, 255, 0.45);
    margin: 6px auto 0;
    border-radius: 1px;
  }

  .tick.major i {
    width: 2px;
    height: 10px;
    background: rgba(0, 240, 255, 0.85);
    box-shadow: 0 0 6px rgba(0, 240, 255, 0.7);
  }

  .hand {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: 50% 100%;
    border-radius: 4px;
    transition: transform 80ms cubic-bezier(0.2, 0.9, 0.3, 1.2);
    z-index: 6;
  }

  .hand.hour {
    width: 4px;
    height: 26%;
    background: linear-gradient(180deg, rgba(255,255,255,0.9), var(--neon-cyan));
    transform: translate(-50%, -100%) rotate(0deg);
    box-shadow: 0 0 8px rgba(0, 240, 255, 0.7);
  }

  .hand.minute {
    width: 3px;
    height: 38%;
    background: linear-gradient(180deg, rgba(255,255,255,0.95), var(--neon-cyan));
    transform: translate(-50%, -100%) rotate(0deg);
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.7);
  }

  .hand.second {
    width: 1px;
    height: 44%;
    background: linear-gradient(180deg, var(--neon-pink), rgba(255,43,214,0.4));
    transform: translate(-50%, -100%) rotate(0deg);
    box-shadow: 0 0 8px rgba(255, 43, 214, 0.7);
  }

  /* tiny still center */
  .core {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffffff;
    transform: translate(-50%, -50%);
    box-shadow:
      0 0 6px #ffffff,
      0 0 14px var(--neon-cyan);
    z-index: 7;
  }

  /* HUD corners */
  .corner {
    position: fixed;
    font-size: 11px;
    color: rgba(0, 240, 255, 0.7);
    letter-spacing: 0.25em;
    text-shadow: 0 0 6px rgba(0, 240, 255, 0.6);
    z-index: 31;
  }
  .corner.tl { top: 16px; left: 20px; }
  .corner.tr { top: 16px; right: 20px; color: rgba(255, 43, 214, 0.7); text-shadow: 0 0 6px rgba(255, 43, 214, 0.6); }
  .corner.bl { bottom: 16px; left: 20px; color: rgba(157, 0, 255, 0.75); text-shadow: 0 0 6px rgba(157, 0, 255, 0.6); }
  .corner.br { bottom: 16px; right: 20px; color: rgba(0, 240, 255, 0.7); text-shadow: 0 0 6px rgba(0, 240, 255, 0.6); }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <filter id="heatHaze" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="2" seed="3">
          <animate attributeName="baseFrequency" dur="22s" values="0.012 0.03;0.018 0.045;0.012 0.03" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" scale="10"/>
      </filter>
    </defs>
  </svg>

  <div class="corner tl">◤ DIM::SHIFT_03</div>
  <div class="corner tr">SIGNAL ▮▮▮▯▯</div>
  <div class="corner bl">FIELD φ 0.998</div>
  <div class="corner br">QUIET MODE ◇</div>

  <div class="horizon"></div>

  <main class="stage" aria-label="アナログ時計">
    <div class="clock">
      <div class="ticks" id="ticks"></div>
      <div class="hand hour" id="hour"></div>
      <div class="hand minute" id="minute"></div>
      <div class="hand second" id="second"></div>
      <div class="core"></div>
    </div>
  </main>

  <div class="mirage" aria-hidden="true">
    <div class="mirage-stack">
      <div class="mirage-echo" id="echo">00:00:00</div>
      <div class="mirage-time" id="mirageTime">00:00:00</div>
      <div class="mirage-meta"><span id="date"></span> ▸ <span id="ampm"></span></div>
    </div>
  </div>

<script>
  (function () {
    const ticksEl = document.getElementById("ticks");

    for (let i = 0; i < 60; i++) {
      const t = document.createElement("div");
      t.className = "tick" + (i % 5 === 0 ? " major" : "");
      t.style.setProperty("--r", `${i * 6}deg`);
      t.innerHTML = "<i></i>";
      ticksEl.appendChild(t);
    }

    const hourHand = document.getElementById("hour");
    const minHand = document.getElementById("minute");
    const secHand = document.getElementById("second");
    const mirageTime = document.getElementById("mirageTime");
    const echo = document.getElementById("echo");
    const dateEl = document.getElementById("date");
    const ampmEl = document.getElementById("ampm");

    const pad = (n) => String(n).padStart(2, "0");
    const weekday = ["日", "月", "火", "水", "木", "金", "土"];

    function tick() {
      const now = new Date();
      const ms = now.getMilliseconds();
      const s = now.getSeconds() + ms / 1000;
      const m = now.getMinutes() + s / 60;
      const h = (now.getHours() % 12) + m / 60;

      secHand.style.transform = `translate(-50%, -100%) rotate(${s * 6}deg)`;
      minHand.style.transform = `translate(-50%, -100%) rotate(${m * 6}deg)`;
      hourHand.style.transform = `translate(-50%, -100%) rotate(${h * 30}deg)`;

      const text = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      mirageTime.textContent = text;
      echo.textContent = text;

      dateEl.textContent =
        `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())} ${weekday[now.getDay()]}`;
      ampmEl.textContent = now.getHours() < 12 ? "AM" : "PM";

      requestAnimationFrame(tick);
    }

    tick();
  })();
</script>
</body>
</html>
