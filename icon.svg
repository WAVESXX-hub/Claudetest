<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0a1422"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <circle cx="90" cy="90" r="62" fill="none" stroke="#7df9ff" stroke-width="2" opacity="0.9"/>
    <circle cx="90" cy="90" r="50" fill="none" stroke="#ff9f1c" stroke-width="1.2" opacity="0.75"/>
    <line x1="90" y1="90" x2="90" y2="46" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="90" y1="90" x2="122" y2="90" stroke="#7df9ff" stroke-width="2" stroke-linecap="round"/>
    <line x1="90" y1="90" x2="90" y2="126" stroke="#ff9f1c" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="90" cy="90" r="3.5" fill="#ffffff"/>
  </g>
</svg>
